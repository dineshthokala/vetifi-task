[pytest]
# Tests import as `server.app.*`, so the repository root must be on sys.path.
# Without this, running pytest from inside server/ fails with a confusing
# ModuleNotFoundError rather than a useful message.
pythonpath = .
testpaths = server/tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:starlette.*