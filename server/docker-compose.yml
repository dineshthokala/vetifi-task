# Vetifi dataset server.
#
#   docker compose up --build
#
# is the entire setup. PostgreSQL 16 starts with a health check, the FastAPI
# service waits for it, and v14 is seeded on first boot.
#
# ADMIN_KEY has no hardcoded default, because a fallback would mean every
# deployment that forgot to set one shares a secret that is published in this
# repository -- on an endpoint that can change a dose. To keep this a
# one-command setup, entrypoint.sh generates a strong random key when the
# variable is absent, persists it, and prints it. Supply your own to override:
#
#   ADMIN_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(32))") \
#     docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetifi
      POSTGRES_USER: vetifi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetifi_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetifi_user -d vetifi"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: vetifitask-server:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://vetifi_user:${POSTGRES_PASSWORD:-vetifi_local_password}@db:5432/vetifi
      # Optional. If unset, entrypoint.sh generates and persists one.
      ADMIN_KEY: "${ADMIN_KEY:-}"
      # Set to 1 to enable random tampering. See BREAK_IT.md section 2.
      CHAOS: "${CHAOS:-0}"
      # Optional. Overrides server/keys/private.hex. Leave unset for the demo.
      ED25519_PRIVATE_KEY: "${ED25519_PRIVATE_KEY:-}"
      VETIFI_ADMIN_KEY_FILE: /srv/data/.admin_key
    volumes:
      # Keeps the generated ADMIN_KEY across restarts.
      - admin_key_data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  admin_key_data: